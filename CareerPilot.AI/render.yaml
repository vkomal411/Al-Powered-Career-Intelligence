services:
  # -------------------------------------------------------------
  # 1. Backend API Service (FastAPI)
  # -------------------------------------------------------------
  - type: web
    name: careerpilot-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python -m spacy download en_core_web_sm && alembic upgrade head"
    startCommand: "gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: careerpilot-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: careerpilot-frontend
          property: host
          urlFormat: "https://{host}"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

  # -------------------------------------------------------------
  # 2. Frontend Web Service (Next.js)
  # -------------------------------------------------------------
  - type: web
    name: careerpilot-frontend
    runtime: node
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: careerpilot-backend
          property: host
          urlFormat: "https://{host}"
      - key: NEXT_PUBLIC_API_BASE
        fromService:
          type: web
          name: careerpilot-backend
          property: host
          urlFormat: "https://{host}"
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false

# ---------------------------------------------------------------
# 3. Managed PostgreSQL Database
# ---------------------------------------------------------------
databases:
  - name: careerpilot-db
    databaseName: career_platform
    user: postgres
    plan: free
